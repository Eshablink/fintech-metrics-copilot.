[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "fintech-metrics-copilot"
version = "0.1.0"
description = "Evidence-first analytics for fictional XYZ Finance using simulated data"
requires-python = ">=3.11,<3.13"
dependencies = ["pandas>=2.2,<3", "PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-PyYAML>=6", "pandas-stubs>=2.2,<3"]

[project.scripts]
fintech-simulate = "copilot.synthetic:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
