[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "fintech-metrics-copilot"
version = "0.1.0"
description = "Evidence-first analytics for fictional XYZ Finance using simulated data"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pandas>=2.2,<3",
  "PyYAML>=6.0.2,<7",
  "duckdb>=1.1,<2",
  "dbt-duckdb>=1.9,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "streamlit>=1.39,<2",
  "qdrant-client>=1.12,<2",
  "pydantic>=2.10,<3",
  "scikit-learn>=1.5,<2",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "types-PyYAML>=6",
  "pandas-stubs>=2.2,<3",
]

[project.scripts]
fintech-simulate = "copilot.synthetic:main"
fintech-load-duckdb = "copilot.storage:main"
fintech-prepare = "copilot.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
